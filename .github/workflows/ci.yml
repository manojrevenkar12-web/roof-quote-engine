name: ci
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: The evaluation reproduces the committed report
        run: |
          npx tsx scripts/evaluate.ts > /dev/null
          git diff --exit-code reports/dev.json
      - name: Quality gate
        run: npx tsx scripts/gate.ts
      - name: Eval cases and example match the world
        run: |
          npx tsx scripts/export.ts
          git diff --exit-code evals/tests.json data/example.json
      - name: README and console data match the reports
        run: |
          npx tsx scripts/readme.ts
          git diff --exit-code README.md web/public/data/console.json
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
